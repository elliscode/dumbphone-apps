<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Directions</title>
    <link rel="stylesheet" href="../css/stylesheet.css?v=027" />
    <link rel="stylesheet" href="../css/loader.css?v=027" />
    <link rel="icon" type="image/png" href="../img/map.favicon.png?v=027" />
    <style>
      .directions-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }
      .directions-form .flex {
        gap: 4px;
      }
      #map {
        width: 100%;
        height: 40vh;
        max-height: 40vh;
        display: none;
      }
      #routes {
        margin-top: 8px;
      }
      .route-option {
        border: 1px solid;
        border-radius: 4px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .route-option.selected {
        font-weight: bold;
      }
      .route-option .duration {
        font-size: 20px;
      }
      #history {
        margin-bottom: 8px;
      }
      #steps {
        margin-top: 8px;
      }
      #steps ol {
        padding-left: 20px;
      }
      #steps li {
        margin-bottom: 8px;
      }
      .history-entry {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <div>
      <b><a href="../index.html">Home</a></b> &gt; <b>directions</b>
    </div>

    <div class="directions-form">
      <div class="flex">
        <input
          type="text"
          id="origin-input"
          class="big fill"
          placeholder="Origin"
          input-group-name="directions"
        />
        <button onclick="useCurrentLocationAsOrigin(event)">&#128204;</button>
      </div>
      <div class="flex">
        <input
          type="text"
          id="destination-input"
          class="big fill"
          placeholder="Destination"
          input-group-name="directions"
        />
        <button onclick="getDirections(event)" primary-button>&#128739;</button>
      </div>
    </div>

    <div id="history"></div>

    <pre id="error" class="error" style="display: none"></pre>

    <div id="map"></div>

    <div id="routes"></div>

    <div id="steps"></div>

    <button id="open-in-maps-button" class="giant-button-half" style="display: none" onclick="openInGoogleMaps(event)">
      Open in Google Maps
    </button>

    <div id="loading">
      <div class="lds-spinner">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <div class="logout">
      <button onclick="logOut(event)">Log out</button>
    </div>
    <script src="../js/utils.js?v=027"></script>
    <script src="../js/env.js"></script>
    <script src="js/directions.js?v=001"></script>
    <script>
if (
  !navigator.userAgent.includes("Chrome") &&
  navigator.userAgent.includes("Safari")
) {
  iosCookieRefresh();
}
checkIfLoggedIn();
getMapsApiKey();
    </script>
  </body>
</html>
