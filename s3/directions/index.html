<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Directions</title>
    <link rel="stylesheet" href="../css/stylesheet.css?v=027" />
    <link rel="stylesheet" href="../css/loader.css?v=027" />
    <link rel="icon" type="image/png" href="../img/map.favicon.png?v=027" />
    <style>
      .directions-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }
      .directions-form .flex {
        gap: 4px;
      }
      #map {
        width: 100%;
        height: 40vh;
        max-height: 40vh;
        display: none;
      }
      #map.fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        z-index: 500;
      }
      body.step-mode > *:not(#map):not(#step-overlay) {
        display: none !important;
      }
      #step-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 600;
        pointer-events: none;
        font-size: 12px;
      }
      #step-overlay-top {
        pointer-events: auto;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 6px;
        background: rgba(255, 255, 255, 0.9);
      }
      #step-overlay-top button {
        font-size: 12px;
        padding: 2px 6px;
      }
      #step-instruction {
        pointer-events: auto;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 26px;
        padding: 6px;
        background: rgba(255, 255, 255, 0.9);
        text-align: center;
      }
      #step-hint-left,
      #step-hint-right,
      #step-zoom-hint-left,
      #step-zoom-hint-right {
        pointer-events: auto;
        position: absolute;
        font-weight: bold;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.9);
        padding: 1px 5px;
      }
      #step-hint-left,
      #step-hint-right {
        bottom: 4px;
      }
      #step-zoom-hint-left,
      #step-zoom-hint-right {
        top: 30px;
      }
      #step-hint-left,
      #step-zoom-hint-left {
        left: 4px;
      }
      #step-hint-right,
      #step-zoom-hint-right {
        right: 4px;
      }
      #routes {
        margin-top: 8px;
      }
      .route-option {
        border: 1px solid;
        border-radius: 4px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .route-option.selected {
        font-weight: bold;
      }
      .route-option .duration {
        font-size: 20px;
      }
      #history {
        margin-bottom: 8px;
      }
      #steps {
        margin-top: 8px;
      }
      #steps ol {
        padding-left: 20px;
      }
      #steps li {
        margin-bottom: 8px;
      }
      .history-entry {
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 4px;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <div>
      <b><a href="../index.html">Home</a></b> &gt; <b>directions</b>
    </div>

    <div class="directions-form">
      <div class="flex">
        <input
          type="text"
          id="origin-input"
          class="big fill"
          placeholder="Origin"
          input-group-name="directions"
        />
        <button onclick="useCurrentLocationAsOrigin(event)">&#128204;</button>
      </div>
      <div class="flex">
        <input
          type="text"
          id="destination-input"
          class="big fill"
          placeholder="Destination"
          input-group-name="directions"
        />
        <button onclick="getDirections(event)" primary-button>&#128739;</button>
      </div>
    </div>

    <div id="history"></div>

    <pre id="error" class="error" style="display: none"></pre>

    <div id="map"></div>

    <div id="routes"></div>

    <div id="steps"></div>

    <button id="step-by-step-button" class="giant-button-half" style="display: none" onclick="openStepByStep(event)">
      Go step by step
    </button>

    <div id="step-overlay">
      <div id="step-overlay-top">
        <button id="step-close-button" onclick="closeStepByStep(event)">Close</button>
        <div id="step-progress"></div>
      </div>
      <div id="step-zoom-hint-left">- 4</div>
      <div id="step-zoom-hint-right">6 +</div>
      <div id="step-instruction"></div>
      <div id="step-hint-left">&lt; 7</div>
      <div id="step-hint-right">9 &gt;</div>
    </div>

    <div id="loading">
      <div class="lds-spinner">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <div class="logout">
      <button onclick="logOut(event)">Log out</button>
    </div>
    <script src="../js/utils.js?v=027"></script>
    <script src="../js/env.js"></script>
    <script src="js/directions.js?v=001"></script>
    <script>
if (
  !navigator.userAgent.includes("Chrome") &&
  navigator.userAgent.includes("Safari")
) {
  iosCookieRefresh();
}
checkIfLoggedIn();
getMapsApiKey();
    </script>
  </body>
</html>
