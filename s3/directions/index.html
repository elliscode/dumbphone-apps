<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Directions</title>
    <link rel="stylesheet" href="../css/stylesheet.css?v=027" />
    <link rel="stylesheet" href="../css/loader.css?v=027" />
    <link rel="icon" type="image/png" href="../img/map.favicon.png?v=027" />
    <style>
      .directions-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }
      .directions-form .flex {
        gap: 4px;
      }
      #map {
        width: 100%;
        height: 40vh;
        max-height: 40vh;
        display: none;
      }
      #map.fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        z-index: 500;
      }
      body.step-mode > *:not(#map):not(#step-overlay) {
        display: none !important;
      }
      #step-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 600;
        pointer-events: none;
        font-size: 12px;
      }
      #step-overlay-top {
        pointer-events: auto;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: nowrap;
        justify-content: space-between;
        align-items: center;
        gap: 2px;
        padding: 3px 4px;
        background: rgba(255, 255, 255, 0.9);
        overflow-x: auto;
      }
      #step-overlay-top button {
        font-size: 10px;
        padding: 1px 4px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      #step-controls {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }
      .step-key-hint {
        font-weight: bold;
        font-size: 10px;
        padding: 1px 3px;
        white-space: nowrap;
      }
      #step-follow-indicator {
        font-size: 10px;
        font-weight: bold;
        padding: 1px 3px;
        white-space: nowrap;
      }
      #step-follow-indicator.active {
        background: #4285f4;
        color: #ffffff;
      }
      #step-progress {
        flex-shrink: 0;
        white-space: nowrap;
      }
      #step-instruction {
        pointer-events: auto;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 6px;
        background: rgba(255, 255, 255, 0.5);
        text-align: center;
      }
      #routes {
        margin-top: 8px;
      }
      .route-option {
        border: 1px solid;
        border-radius: 4px;
        padding: 8px;
        margin-bottom: 8px;
      }
      .route-option.selected {
        font-weight: bold;
      }
      .route-option .duration {
        font-size: 20px;
      }
      #history {
        margin-bottom: 8px;
      }
      #steps {
        margin-top: 8px;
      }
      #steps ol {
        padding-left: 20px;
      }
      #steps li {
        margin-bottom: 8px;
      }
      .history-row {
        display: flex;
        gap: 4px;
        margin-bottom: 4px;
      }
      .history-entry {
        flex-grow: 1;
        text-align: left;
        box-sizing: border-box;
      }
      .history-remove {
        flex-shrink: 0;
      }
    </style>
  </head>

  <body>
    <div>
      <b><a href="../index.html">Home</a></b> &gt; <b>directions</b>
    </div>

    <div class="directions-form">
      <div class="flex">
        <input
          type="text"
          id="origin-input"
          class="big fill"
          placeholder="Origin"
          input-group-name="directions"
        />
        <button onclick="useCurrentLocationAsOrigin(event)">&#128204;</button>
      </div>
      <div class="flex" style="justify-content: center">
        <button onclick="swapSourceAndDestination(event)">&#128260;</button>
      </div>
      <div class="flex">
        <input
          type="text"
          id="destination-input"
          class="big fill"
          placeholder="Destination"
          input-group-name="directions"
        />
        <button onclick="getDirections(event)" primary-button>&#128739;</button>
      </div>
      <label class="flex" style="align-items: center">
        <input type="checkbox" id="show-location-checkbox" onchange="handleShowLocationToggle(event)" />
        Show my location
      </label>
    </div>

    <div id="history"></div>

    <pre id="error" class="error" style="display: none"></pre>

    <div id="map"></div>

    <div id="routes"></div>

    <div id="steps"></div>

    <button id="step-by-step-button" class="giant-button-half" style="display: none" onclick="openStepByStep(event)">
      Go step by step
    </button>

    <div id="step-overlay">
      <div id="step-overlay-top">
        <button id="step-close-button" onclick="closeStepByStep(event)">Close</button>
        <div id="step-controls">
          <span class="step-key-hint">- 4</span>
          <span class="step-key-hint">&lt; 7</span>
          <span id="step-follow-indicator" style="display: none">* &#128694;</span>
          <span class="step-key-hint">9 &gt;</span>
          <span class="step-key-hint">6 +</span>
        </div>
        <div id="step-progress"></div>
      </div>
      <div id="step-instruction"></div>
    </div>

    <div id="loading">
      <div class="lds-spinner">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <div class="logout">
      <button onclick="logOut(event)">Log out</button>
    </div>
    <script src="../js/utils.js?v=027"></script>
    <script src="../js/env.js"></script>
    <script src="js/directions.js?v=001"></script>
    <script>
if (
  !navigator.userAgent.includes("Chrome") &&
  navigator.userAgent.includes("Safari")
) {
  iosCookieRefresh();
}
checkIfLoggedIn();
getMapsApiKey();
    </script>
  </body>
</html>
